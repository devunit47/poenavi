name: Check PoETore Trade Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  official-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check official Trade data
        run: python scripts/update_poetore_trade_data.py --check-official
      - name: Publish report summary
        if: ${{ always() && hashFiles('build/poetore-official-check-report.md') != '' }}
        run: cat build/poetore-official-check-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: poetore-official-check-reports
          path: |
            build/poetore-official-check-report.json
            build/poetore-official-check-report.md
          if-no-files-found: error
          retention-days: 7
