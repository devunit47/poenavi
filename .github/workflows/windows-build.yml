name: Windows Build Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\scripts\run_tests_by_file.ps1 -Python python -ShardIndex ${{ matrix.shard }} -ShardCount 3

  package:
    name: Build release assets
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build release assets
        shell: pwsh
        run: .\scripts\build_release.ps1 -Python python

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $expectedVersion = (python -c "from src.version import APP_VERSION; print(APP_VERSION)").Trim()
          foreach ($path in @("dist\PoENavi\PoENavi.exe", "dist\PoENavi\PoENaviUpdater.exe")) {
            $metadata = (Get-Item $path).VersionInfo
            if ($metadata.ProductName -ne "PoENavi") {
              throw "$path has unexpected ProductName: $($metadata.ProductName)"
            }
            if ($metadata.ProductVersion -ne $expectedVersion) {
              throw "$path has unexpected ProductVersion: $($metadata.ProductVersion)"
            }
            if ($metadata.FileVersion -ne $expectedVersion) {
              throw "$path has unexpected FileVersion: $($metadata.FileVersion)"
            }
          }

      - name: Upload verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: PoENavi-unsigned-windows
          path: |
            PoENavi.zip
            PoENavi.zip.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    if: ${{ always() }}
    needs: [tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all test shards and the release build
        if: ${{ needs.tests.result != 'success' || needs.package.result != 'success' }}
        run: exit 1
